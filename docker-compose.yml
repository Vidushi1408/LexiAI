services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      LEXI_OLLAMA_URL: http://ollama:11434/api/chat
      LEXI_OLLAMA_MODEL: ${LEXI_OLLAMA_MODEL:-llama3.2:3b}
      LEXI_ZERO_RETENTION: ${LEXI_ZERO_RETENTION:-0}
      LEXI_SECRET_KEY: ${LEXI_SECRET_KEY:-}
      LEXI_SESSION_COOKIE_SECURE: ${LEXI_SESSION_COOKIE_SECURE:-1}
      DATABASE_URL: postgresql+psycopg://lexi:${POSTGRES_PASSWORD:-lexi}@postgres:5432/lexi
    volumes:
      - lexi-data:/app/data
    depends_on:
      ollama:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lexi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lexi}
      POSTGRES_DB: lexi
    volumes:
      - lexi-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lexi -d lexi"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

  ollama-pull:                       # one-shot: downloads the model, then exits
    image: ollama/ollama:latest
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${LEXI_OLLAMA_MODEL:-llama3.2:3b}"]
    restart: "no"

volumes:
  lexi-data:
  lexi-postgres:
  ollama-models:
