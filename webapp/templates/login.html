{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="auth-shell">
  <div class="card">
    <h1 style="margin-bottom:4px;">🏢 Lexi AI</h1>
    <p class="page-caption" style="margin-bottom:20px;">Enterprise Document Intelligence Platform</p>
    {% if error %}<div class="flash flash-error" style="margin-bottom:16px;">{{ error }}</div>{% endif %}
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field">
        <label>Username</label>
        <input type="text" name="username" autofocus required>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" name="password" required>
      </div>
      <button class="btn btn-primary btn-block" type="submit">Sign in</button>
    </form>
  </div>
</div>
{% endblock %}
