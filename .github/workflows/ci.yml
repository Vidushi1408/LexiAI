name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, test, eval gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install dependencies
        run: |
          pip install -r requirements-ci.txt
          python -c "import nltk; [nltk.download(p, quiet=True) for p in ('punkt', 'punkt_tab')]"
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest -q
      - name: Retrieval quality gate (BM25-only, no model download)
        run: python eval/run_eval.py --no-vectors --min-recall5 0.85

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install mypy types-PyYAML types-requests pydantic
      - run: mypy

  security:
    name: Secret and dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # gitleaks scans history
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Audit dependencies for known vulnerabilities
        run: |
          pip install pip-audit
          # PYSEC-2026-3740 (nltk): affects model save/load APIs given caller-controlled paths
          # (TransitionParser, AveragedPerceptron). Lexi only tokenises/tags/lemmatises and never
          # passes user-controlled paths to them; no fixed release exists. Re-check when one ships.
          pip-audit -r requirements.txt --progress-spinner off --ignore-vuln PYSEC-2026-3740

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
